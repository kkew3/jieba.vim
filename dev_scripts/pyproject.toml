[project]
name = "jieba-vim-dev-scripts"
version = "0.1.0"
description = "jieba.vim dev scripts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1.3",
    "markupsafe>=3.0.4",
]

[tool.ruff]
line-length = 80
indent-width = 4
extend-exclude = ["vimhelp"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
